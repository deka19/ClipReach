<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hiring Flyer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Importing specific fonts to match the flyer's aesthetic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&family=Playfair+Display:wght@900&family=Roboto:wght@500;700;900&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'serif': ['"Playfair Display"', 'serif'],    /* For the top heading */
                        'impact': ['"Oswald"', 'sans-serif'],        /* For the tall red text */
                        'sans': ['"Roboto"', 'sans-serif'],          /* For standard bold text */
                    },
                    colors: {
                        'flyer-red': '#ff0000',                      /* Pure red from the image */
                        'flyer-black': '#000000'                     /* Pure black */
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-white min-h-screen flex items-center justify-center p-4 antialiased">
    
    <!-- Flyer Container -->
    <div class="max-w-2xl w-full flex flex-col items-center bg-white py-12 md:py-20 px-6 sm:px-12">
        
        <!-- Top Heading -->
        <h1 class="font-serif text-5xl md:text-[4.5rem] font-black tracking-wide text-flyer-black mb-10 whitespace-nowrap">
            WE ARE HIRING
        </h1>

        <!-- Role Title Block -->
        <div class="flex flex-col items-center text-center leading-none mb-10 w-full">
            <h2 class="font-sans text-4xl md:text-[3rem] font-black text-flyer-black uppercase tracking-tight mb-3">
                BACK OFFICE
            </h2>
            <h2 class="font-sans text-4xl md:text-[3rem] font-black text-flyer-black uppercase tracking-tight mb-4">
                EXECUTIVE <span class="text-3xl md:text-4xl">&</span>
            </h2>
            
            <!-- Highlighted Red Text -->
            <h2 class="font-impact text-7xl md:text-[7.5rem] font-bold text-flyer-red uppercase tracking-tight transform scale-y-110 mt-2">
                TELECALLER
            </h2>
        </div>

        <!-- Salary Block -->
        <div class="flex items-baseline justify-center gap-3 mb-12 mt-6 w-full">
            <span class="font-sans text-6xl md:text-[5rem] font-black text-flyer-black uppercase tracking-tighter">SALARY</span>
            <span class="font-sans text-2xl md:text-3xl font-bold text-flyer-black tracking-tight self-end mb-2 md:mb-3">upto</span>
            <span class="font-sans text-6xl md:text-[5.5rem] font-black text-flyer-red uppercase tracking-tighter">20K</span>
        </div>

        <!-- Requirements Section -->
        <div class="w-full max-w-lg mx-auto mb-14">
            <h3 class="font-sans text-xl md:text-2xl font-black text-flyer-black uppercase underline decoration-3 underline-offset-4 mb-4">
                REQUIREMENT
            </h3>
            <ul class="list-disc pl-6 space-y-2 font-sans text-lg md:text-xl text-flyer-black font-medium leading-relaxed">
                <li>Experience in Back-Office / Telecalling.</li>
                <li>Fluent in Assamese & Basic English.</li>
                <li>Basic Computer Skills.</li>
            </ul>
        </div>

        <!-- Footer Contact Info -->
        <div class="flex flex-col items-center text-center w-full">
            <p class="font-sans text-2xl md:text-[2rem] font-black text-flyer-black uppercase tracking-wide mb-3">
                LOCATION: JYOTIKUCHI
            </p>
            <p class="font-sans text-2xl md:text-[2rem] font-black text-flyer-black uppercase tracking-wide">
                CONTACT: 6002413305
            </p>
        </div>

    </div>
</body>
</html>
